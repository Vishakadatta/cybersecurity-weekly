name: "Setup pipeline runtime"
description: "Checkout latest main, install Python 3.12 + pinned deps, cache the sentence-transformers MiniLM model."

inputs:
  fetch-depth:
    description: "Git checkout fetch depth"
    required: false
    default: "1"

runs:
  using: "composite"
  steps:
    - name: Checkout (default branch HEAD)
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.repository.default_branch }}
        fetch-depth: ${{ inputs.fetch-depth }}

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: "pip"
        cache-dependency-path: scripts/requirements.txt

    - name: Cache sentence-transformers model
      uses: actions/cache@v4
      with:
        path: ~/.cache/huggingface
        key: hf-${{ runner.os }}-minilm-l6-v2-v1
        restore-keys: |
          hf-${{ runner.os }}-minilm-

    - name: Install Python dependencies
      shell: bash
      run: pip install --upgrade pip && pip install -r scripts/requirements.txt

    - name: Configure git bot identity
      shell: bash
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
