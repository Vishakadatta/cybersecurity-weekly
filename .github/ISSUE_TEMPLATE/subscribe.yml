name: Subscribe to Newsletter
description: Subscribe to receive Cybersecurity Weekly in your inbox every Monday
title: "Subscribe"
labels: ["subscribe"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for subscribing to Cybersecurity Weekly! Enter your email below and we'll add you to the list.
        Your email will be redacted from this issue within minutes for privacy.
  - type: input
    id: email
    attributes:
      label: Email Address
      description: The email address where you want to receive the newsletter
      placeholder: you@example.com
    validations:
      required: true
