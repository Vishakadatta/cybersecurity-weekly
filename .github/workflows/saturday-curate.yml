name: "Saturday: Curate & Summarize"

on:
  schedule:
    - cron: "0 19 * * 6"  # Saturday 12:00 PM PT (7:00 PM UTC)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  curate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Scrape for new articles
        run: python scripts/scrape.py

      - name: Curate and summarize with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash-lite
          GEMINI_DELAY_SECONDS: "15"
        run: python scripts/curate.py

      - name: Commit curated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/raw/
          git diff --cached --quiet || git commit -m "Saturday curate: $(date -u +'%Y-%m-%d')"
          git push
