name: "2. Saturday: Curate & summarize"

# Stage 2: embed-dedupe + Groq summarization.
# Auto-runs on Friday's success OR on Saturday cron OR manually.

on:
  schedule:
    - cron: "0 19 * * 6"  # Saturday 12:00 PM PT (7:00 PM UTC)
  workflow_dispatch:
  workflow_run:
    workflows: ["1. Friday: Scrape sources"]
    types: [completed]

permissions:
  contents: write
  issues: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  curate:
    # If triggered by workflow_run, only continue if Friday actually succeeded
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Setup pipeline runtime
        uses: ./.github/actions/setup-pipeline

      - name: Mid-cycle scrape for weekend news
        run: python scripts/scrape.py

      - name: Curate (embedding dedupe + Groq summarization)
        id: curate
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LLM_DELAY_SECONDS: "3"
        run: |
          python scripts/curate.py | tee curate.log
          echo "suppressed=$(grep -oE 'Suppressed [0-9]+ near-duplicate' curate.log | grep -oE '[0-9]+' | head -1 || echo 0)" >> "$GITHUB_OUTPUT"
          echo "curated=$(grep -oE 'Saved [0-9]+ curated' curate.log | grep -oE '[0-9]+' | head -1 || echo 0)" >> "$GITHUB_OUTPUT"

      - name: Commit curated data
        run: |
          git add content/raw/ content/latest.json
          if git diff --cached --quiet; then
            echo "No new curated data to commit"
          else
            git commit -m "chore(pipeline): saturday curate $(date -u +'%Y-%m-%d')"
            git push
          fi

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Saturday curate"
            echo ""
            echo "- Near-duplicates suppressed by embedding dedupe: **${{ steps.curate.outputs.suppressed }}**"
            echo "- Articles curated and saved: **${{ steps.curate.outputs.curated }}**"
            echo "- Triggered by: \`${{ github.event_name }}\`"
            echo ""
            echo "_Next stage (Sunday finalize) will auto-run on this workflow's success, or at its scheduled time._"
          } >> "$GITHUB_STEP_SUMMARY"

  notify-failure:
    needs: curate
    if: failure() && (github.event_name == 'schedule' || github.event_name == 'workflow_run')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open failure issue
        uses: actions/github-script@v7
        with:
          script: |
            const run = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[pipeline] Saturday curate failed (${new Date().toISOString().slice(0,10)})`,
              labels: ['pipeline-failure', 'urgent'],
              body: [
                '**Stage 2 / Saturday curate failed.**',
                '',
                'Likely causes: Groq + Gemini both rate-limited/down, malformed LLM JSON, or sentence-transformers model download blocked.',
                '',
                `- Failed run: ${run}`,
                '',
                'Sunday\'s finalize step can still partially run on whatever was previously curated, but new articles will be missing.',
              ].join('\n'),
            });
