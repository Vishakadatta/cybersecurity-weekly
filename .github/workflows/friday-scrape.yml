name: "1. Friday: Scrape sources"

# Stage 1 of the weekly pipeline.
# Runs on cron, on manual dispatch, and can be re-run safely (scraper is idempotent).
# On success, GitHub fires a workflow_run event that Stage 2 (Saturday) listens for.

on:
  schedule:
    - cron: "30 23 * * 5"  # Friday 4:30 PM PT (11:30 PM UTC)
  workflow_dispatch:

permissions:
  contents: write
  issues: write  # to file a failure issue if the job dies

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Setup pipeline runtime
        uses: ./.github/actions/setup-pipeline

      - name: Run scraper
        id: scrape
        run: |
          python scripts/scrape.py | tee scrape.log
          echo "article_count=$(grep -oE '[0-9]+ total articles' scrape.log | head -1 | grep -oE '[0-9]+' || echo 0)" >> "$GITHUB_OUTPUT"

      - name: Commit raw data
        run: |
          git add content/raw/ content/latest.json
          if git diff --cached --quiet; then
            echo "No new articles to commit"
          else
            git commit -m "chore(pipeline): friday scrape $(date -u +'%Y-%m-%d')"
            git push
          fi

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Friday scrape"
            echo ""
            echo "- Articles in cumulative set: **${{ steps.scrape.outputs.article_count }}**"
            echo "- Triggered by: \`${{ github.event_name }}\`"
            echo ""
            echo "_Next stage (Saturday curate) will auto-run on this workflow's success, or at its scheduled time._"
          } >> "$GITHUB_STEP_SUMMARY"

  notify-failure:
    needs: scrape
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open failure issue
        uses: actions/github-script@v7
        with:
          script: |
            const run = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[pipeline] Friday scrape failed (${new Date().toISOString().slice(0,10)})`,
              labels: ['pipeline-failure', 'urgent'],
              body: [
                '**Stage 1 / Friday scrape failed.**',
                '',
                'Without raw articles, the rest of the week\'s pipeline cannot run.',
                '',
                `- Failed run: ${run}`,
                '- Likely cause: source feed timeout, network blip, or feedparser regression.',
                '',
                'Re-run manually after diagnosing. If a single feed is the culprit, you may need to temporarily remove it from `scripts/sources.json`.',
              ].join('\n'),
            });
