name: "4. Monday: Send newsletter & deploy"

# Stage 4: emergency-check, deploy Astro site, send newsletter via Brevo.
# Auto-runs on Sunday's success OR on Monday cron OR manually.

on:
  schedule:
    - cron: "0 16 * * 1"  # Monday 9:00 AM PT (4:00 PM UTC)
  workflow_dispatch:
  workflow_run:
    workflows: ["3. Sunday: Finalize & rank"]
    types: [completed]

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  # Pages requires its own group name; the Monday workflow is the only one that touches pages.
  group: pages
  cancel-in-progress: false

jobs:
  emergency-check:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      head_sha: ${{ steps.head.outputs.sha }}
    steps:
      - name: Setup pipeline runtime
        uses: ./.github/actions/setup-pipeline

      - name: Monday emergency check
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_MODEL: gemini-2.5-pro
          LLM_DELAY_SECONDS: "10"
          SITE_URL: ${{ vars.SITE_URL }}
          UNSUBSCRIBE_URL: ${{ vars.UNSUBSCRIBE_URL }}
        run: python scripts/monday_check.py

      - name: Commit any emergency updates
        run: |
          git add content/
          if git diff --cached --quiet; then
            echo "No emergency updates"
          else
            git commit -m "chore(pipeline): monday emergency update $(date -u +'%Y-%m-%d')"
            git push
          fi

      - name: Capture HEAD SHA for downstream jobs
        id: head
        run: |
          sha=$(git rev-parse HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Pinned SHA for downstream jobs: $sha"

  send-newsletter:
    needs: emergency-check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact SHA from emergency-check
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.emergency-check.outputs.head_sha }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Install Python dependencies
        run: pip install --upgrade pip && pip install -r scripts/requirements.txt

      - name: Send newsletter via Brevo
        id: send
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_LIST_ID: ${{ secrets.BREVO_LIST_ID }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_NAME: ${{ vars.SENDER_NAME }}
          UNSUBSCRIBE_URL: ${{ vars.UNSUBSCRIBE_URL }}
        run: |
          python scripts/send_newsletter.py | tee send.log
          echo "sent=$(grep -oE 'Done: [0-9]+ sent' send.log | grep -oE '[0-9]+' | head -1 || echo 0)" >> "$GITHUB_OUTPUT"
          echo "failed=$(grep -oE '[0-9]+ failed' send.log | grep -oE '[0-9]+' | head -1 || echo 0)" >> "$GITHUB_OUTPUT"

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Newsletter send"
            echo ""
            echo "- Emails sent: **${{ steps.send.outputs.sent }}**"
            echo "- Failed:      **${{ steps.send.outputs.failed }}**"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-site:
    needs: emergency-check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout exact SHA from emergency-check
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.emergency-check.outputs.head_sha }}

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Build Astro site
        run: npx astro build
        env:
          ASTRO_TELEMETRY_DISABLED: 1
          PUBLIC_BREVO_FORM_URL: ${{ vars.PUBLIC_BREVO_FORM_URL }}
          PUBLIC_BREVO_UNSUBSCRIBE_URL: ${{ vars.PUBLIC_BREVO_UNSUBSCRIBE_URL }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  notify-failure:
    needs: [emergency-check, send-newsletter, deploy-site]
    if: failure() && (github.event_name == 'schedule' || github.event_name == 'workflow_run')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open failure issue
        uses: actions/github-script@v7
        with:
          script: |
            const run = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const failedJobs = [
              `emergency-check: ${{ needs.emergency-check.result }}`,
              `send-newsletter: ${{ needs.send-newsletter.result }}`,
              `deploy-site:     ${{ needs.deploy-site.result }}`,
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[pipeline] Monday send/deploy failed (${new Date().toISOString().slice(0,10)})`,
              labels: ['pipeline-failure', 'urgent', 'subscriber-impact'],
              body: [
                '**Stage 4 / Monday send-or-deploy failed.**',
                '',
                'This is the user-visible stage — subscribers may not have received the newsletter, or the site may not have updated.',
                '',
                '```',
                failedJobs,
                '```',
                '',
                `- Failed run: ${run}`,
                '- Likely causes: Brevo API limit, sender not verified, BREVO_LIST_ID wrong, GitHub Pages misconfig.',
                '',
                'If send-newsletter failed but deploy succeeded, you can manually re-run just `send-newsletter` via workflow_dispatch.',
              ].join('\n'),
            });
