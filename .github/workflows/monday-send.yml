name: "Monday: Send Newsletter & Deploy"

on:
  schedule:
    - cron: "0 16 * * 1"  # Monday 9:00 AM PT (4:00 PM UTC)
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  emergency-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Monday emergency check
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash-lite
          GEMINI_DELAY_SECONDS: "30"
        run: python scripts/monday_check.py

      - name: Commit any emergency updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/
          git diff --cached --quiet || git commit -m "Monday emergency update: $(date -u +'%Y-%m-%d')"
          git push

  send-newsletter:
    needs: emergency-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (latest, after emergency check)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Checkout private data store
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/cybersecurity-weekly-private
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private-data

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Send newsletter
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          PRIVATE_DATA_PATH: ${{ github.workspace }}/private-data
        run: python scripts/send_newsletter.py

  deploy-site:
    needs: emergency-check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout (latest, after emergency check)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Build Astro site
        run: npx astro build
        env:
          ASTRO_TELEMETRY_DISABLED: 1

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
