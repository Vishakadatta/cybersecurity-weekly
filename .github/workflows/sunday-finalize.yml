name: "3. Sunday: Finalize & rank"

# Stage 3: final scrape + re-curate + Gemini tournament ranking.
# Auto-runs on Saturday's success OR on Sunday cron OR manually.

on:
  schedule:
    - cron: "0 1 * * 1"  # Sunday 6:00 PM PT (Monday 1:00 AM UTC)
  workflow_dispatch:
  workflow_run:
    workflows: ["2. Saturday: Curate & summarize"]
    types: [completed]

permissions:
  contents: write
  issues: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  finalize:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Setup pipeline runtime
        uses: ./.github/actions/setup-pipeline

      - name: Final scrape for weekend news
        run: python scripts/scrape.py

      - name: Re-curate (catch newly scraped articles)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LLM_DELAY_SECONDS: "3"
        run: python scripts/curate.py

      - name: Tournament ranking + finalize (Gemini)
        id: finalize
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_MODEL: gemini-2.5-pro
          LLM_DELAY_SECONDS: "10"
          SITE_URL: ${{ vars.SITE_URL }}
          UNSUBSCRIBE_URL: ${{ vars.UNSUBSCRIBE_URL }}
        run: |
          python scripts/finalize.py | tee finalize.log
          echo "tier1=$(grep -oE 'Tier 1 \(Breaking\):\s+[0-9]+' finalize.log | grep -oE '[0-9]+' | head -1 || echo 0)" >> "$GITHUB_OUTPUT"
          echo "tier2=$(grep -oE 'Tier 2 \(Focus\):\s+[0-9]+' finalize.log | grep -oE '[0-9]+' | head -1 || echo 0)" >> "$GITHUB_OUTPUT"
          echo "tier3=$(grep -oE 'Tier 3 \(Notable\):\s+[0-9]+' finalize.log | grep -oE '[0-9]+' | head -1 || echo 0)" >> "$GITHUB_OUTPUT"
          echo "subject=$(grep -oE 'Subject: .*' finalize.log | sed 's/Subject: //' | head -1)" >> "$GITHUB_OUTPUT"

      - name: Commit finalized content
        run: |
          # Only content/ — never templates/ (template changes go through PRs)
          git add content/
          if git diff --cached --quiet; then
            echo "No finalized changes to commit"
          else
            git commit -m "chore(pipeline): sunday finalize $(date -u +'%Y-%m-%d')"
            git push
          fi

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Sunday finalize"
            echo ""
            echo "**Subject line:** ${{ steps.finalize.outputs.subject }}"
            echo ""
            echo "| Tier | Count |"
            echo "|---|---|"
            echo "| Tier 1 (Breaking) | ${{ steps.finalize.outputs.tier1 }} |"
            echo "| Tier 2 (Focus)    | ${{ steps.finalize.outputs.tier2 }} |"
            echo "| Tier 3 (Notable)  | ${{ steps.finalize.outputs.tier3 }} |"
            echo ""
            echo "Triggered by: \`${{ github.event_name }}\`"
            echo ""
            echo "_Next stage (Monday send) will auto-run on this workflow's success, or at its scheduled time._"
          } >> "$GITHUB_STEP_SUMMARY"

  notify-failure:
    needs: finalize
    if: failure() && (github.event_name == 'schedule' || github.event_name == 'workflow_run')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open failure issue
        uses: actions/github-script@v7
        with:
          script: |
            const run = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[pipeline] Sunday finalize failed (${new Date().toISOString().slice(0,10)})`,
              labels: ['pipeline-failure', 'urgent'],
              body: [
                '**Stage 3 / Sunday finalize failed.**',
                '',
                'This blocks Monday\'s newsletter. The site can still deploy stale content but no new edition will be sent.',
                '',
                `- Failed run: ${run}`,
                '- Likely causes: Gemini rate limit / quota, malformed ranking JSON, missing curated file.',
                '',
                'Re-run after diagnosing. If Gemini is hard-down, the LLM_CLIENT will fall back to Groq automatically — verify GROQ_API_KEY is set.',
              ].join('\n'),
            });
