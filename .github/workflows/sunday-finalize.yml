name: "Sunday: Finalize & Rank"

on:
  schedule:
    - cron: "0 1 * * 1"  # Sunday 6:00 PM PT (Monday 1:00 AM UTC)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Final scrape for weekend news
        run: python scripts/scrape.py

      - name: Re-curate with new articles (Groq primary)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LLM_DELAY_SECONDS: "3"
        run: python scripts/curate.py

      - name: Tournament ranking and finalize (Gemini primary)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_MODEL: gemini-2.5-pro
          LLM_DELAY_SECONDS: "10"
          SITE_URL: ${{ vars.SITE_URL }}
          UNSUBSCRIBE_URL: ${{ vars.UNSUBSCRIBE_URL }}
        run: python scripts/finalize.py

      - name: Commit finalized content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/ templates/
          git diff --cached --quiet || git commit -m "Sunday finalize: $(date -u +'%Y-%m-%d')"
          git push
