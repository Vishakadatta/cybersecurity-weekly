name: CI

# Lint + build validation on every PR and on pushes to main that touch code.

on:
  pull_request:
    paths:
      - "scripts/**"
      - "src/**"
      - "templates/**"
      - "package*.json"
      - "astro.config.mjs"
      - "tsconfig.json"
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "src/**"
      - "package*.json"
      - "astro.config.mjs"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python syntax + import smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Install deps
        run: pip install --upgrade pip && pip install -r scripts/requirements.txt

      - name: Syntax check
        run: |
          python -c "
          import ast, sys, pathlib
          errors = 0
          for f in pathlib.Path('scripts').glob('*.py'):
              try:
                  ast.parse(f.read_text())
                  print(f'OK  {f}')
              except SyntaxError as e:
                  print(f'ERR {f}: {e}')
                  errors += 1
          sys.exit(1 if errors else 0)
          "

      - name: Import smoke (modules load without crashing)
        env:
          GROQ_API_KEY: "test-placeholder"
          GEMINI_API_KEY: "test-placeholder"
        run: |
          cd scripts
          python -c "import scrape, dedupe, discover, llm_client, curate, finalize, monday_check, send_newsletter, edition; print('All imports OK')"

  astro:
    name: Astro build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install Node deps (fresh, cross-platform safe)
        # Lockfile was generated on macOS; npm bug #4828 means the
        # Linux-only @rollup/rollup-linux-x64-gnu binary isn't listed.
        # Nuke the lockfile + any cached node_modules and let npm install
        # re-resolve per-platform.
        run: |
          rm -rf node_modules package-lock.json
          npm install --no-audit --no-fund

      - name: Build (with placeholder env vars)
        env:
          ASTRO_TELEMETRY_DISABLED: 1
          PUBLIC_BREVO_FORM_URL: "https://sibforms.com/serve/PLACEHOLDER"
          PUBLIC_BREVO_UNSUBSCRIBE_URL: "https://example.com/unsub"
        run: npx astro build

      - name: Verify expected pages built
        run: |
          test -f dist/index.html
          test -d dist/archive
          echo "All expected pages present"
