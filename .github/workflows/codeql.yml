name: CodeQL

# Static-analysis security scan across both languages in the repo.
# Runs on every PR touching code, every push to main, and weekly to catch
# advisories that emerge after a commit lands.

on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "src/**"
      - "templates/**"
      - "*.mjs"
      - "*.json"
      - "*.ts"
      - ".github/workflows/codeql.yml"
  pull_request:
    branches: [main]
    paths:
      - "scripts/**"
      - "src/**"
      - "templates/**"
      - "*.mjs"
      - "*.json"
      - "*.ts"
      - ".github/workflows/codeql.yml"
  schedule:
    - cron: "0 11 * * 1"  # Monday 11:00 UTC — runs before the Monday newsletter ships

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language: ["javascript-typescript", "python"]

    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
