name: Weekly pipeline

# Schedule table (all UTC, biased to PDT = UTC-7):
# ┌─────────────────────┬─────────────────┬──────────────┬──────────────┐
# │ Cron (UTC)          │ PT-summer (PDT) │ PT-winter    │ Action       │
# ├─────────────────────┼─────────────────┼──────────────┼──────────────┤
# │ 30 23 * * 5         │ Fri 4:30 PM     │ Fri 3:30 PM  │ scrape #1    │
# │ 0 15 * * 6          │ Sat 8:00 AM     │ Sat 7:00 AM  │ scrape+curate│
# │ 0 21 * * 6          │ Sat 2:00 PM     │ Sat 1:00 PM  │ curate sweep │
# │ 0 3 * * 0           │ Sat 8:00 PM     │ Sat 7:00 PM  │ curate sweep │
# │ 0 15 * * 0          │ Sun 8:00 AM     │ Sun 7:00 AM  │ scrape+curate│
# │ 0 19 * * 0          │ Sun 12:00 PM    │ Sun 11:00 AM │ finalize #1  │
# │ 0 1 * * 1           │ Sun 6:00 PM     │ Sun 5:00 PM  │ final sweep  │
# │ 0 12 * * 1          │ Mon 5:00 AM     │ Mon 4:00 AM  │ final LAST   │
# │ 30 15 * * 1         │ Mon 8:30 AM     │ Mon 7:30 AM  │ send+deploy  │
# └─────────────────────┴─────────────────┴──────────────┴──────────────┘
# Monday send completes before 10 AM PT in both DST states.

on:
  schedule:
    - cron: "30 23 * * 5"
    - cron: "0 15 * * 6"
    - cron: "0 21 * * 6"
    - cron: "0 3 * * 0"
    - cron: "0 15 * * 0"
    - cron: "0 19 * * 0"
    - cron: "0 1 * * 1"
    - cron: "0 12 * * 1"
    - cron: "30 15 * * 1"
  workflow_dispatch:
    inputs:
      stage:
        description: 'Stage to run. "all" cascades through every stage.'
        required: true
        default: all
        type: choice
        options:
          - all
          - from_curate
          - from_finalize
          - from_send
          - only_scrape
          - only_curate
          - only_finalize
          - only_send

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: pipeline
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Router: figure out which stage(s) to run.
  # ─────────────────────────────────────────────────────────────────────────
  plan:
    runs-on: ubuntu-latest
    outputs:
      stage: ${{ steps.pick.outputs.stage }}
      run_scrape:   ${{ steps.pick.outputs.run_scrape }}
      run_curate:   ${{ steps.pick.outputs.run_curate }}
      run_finalize: ${{ steps.pick.outputs.run_finalize }}
      run_send:     ${{ steps.pick.outputs.run_send }}
      is_deadline:  ${{ steps.pick.outputs.is_deadline }}
    steps:
      - id: pick
        run: |
          if [ -n "${{ inputs.stage }}" ]; then
            mode="${{ inputs.stage }}"
          else
            case "${{ github.event.schedule }}" in
              "30 23 * * 5") mode="only_scrape" ;;
              "0 15 * * 6")  mode="scrape_curate" ;;
              "0 21 * * 6")  mode="only_curate" ;;
              "0 3 * * 0")   mode="only_curate" ;;
              "0 15 * * 0")  mode="scrape_curate_deadline" ;;
              "0 19 * * 0")  mode="only_finalize" ;;
              "0 1 * * 1")   mode="only_finalize" ;;
              "0 12 * * 1")  mode="finalize_deadline" ;;
              "30 15 * * 1") mode="only_send" ;;
              *)             mode="only_scrape" ;;
            esac
          fi

          s=false; c=false; f=false; n=false; d=false
          case "$mode" in
            all)                      s=true;  c=true;  f=true;  n=true ;;
            from_curate)                       c=true;  f=true;  n=true ;;
            from_finalize)                              f=true;  n=true ;;
            from_send)                                           n=true ;;
            only_scrape)              s=true ;;
            only_curate)                       c=true ;;
            only_finalize)                              f=true ;;
            only_send)                                           n=true ;;
            scrape_curate)            s=true;  c=true ;;
            scrape_curate_deadline)   s=true;  c=true;           d=true ;;
            finalize_deadline)                          f=true;  d=true ;;
          esac

          echo "stage=$mode"         >> "$GITHUB_OUTPUT"
          echo "run_scrape=$s"       >> "$GITHUB_OUTPUT"
          echo "run_curate=$c"       >> "$GITHUB_OUTPUT"
          echo "run_finalize=$f"     >> "$GITHUB_OUTPUT"
          echo "run_send=$n"         >> "$GITHUB_OUTPUT"
          echo "is_deadline=$d"      >> "$GITHUB_OUTPUT"
          echo "▶ Mode: $mode  (scrape=$s curate=$c finalize=$f send=$n deadline=$d)"

  # ─────────────────────────────────────────────────────────────────────────
  # Stage 1: scrape
  # ─────────────────────────────────────────────────────────────────────────
  scrape:
    needs: plan
    if: needs.plan.outputs.run_scrape == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: scripts/requirements-light.txt
      - run: pip install -r scripts/requirements-light.txt
      - name: Scrape
        run: python scripts/scrape.py
      - name: Commit raw data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/raw/ content/latest.json
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "chore(pipeline): scrape $(date -u +'%Y-%m-%d')"
          for attempt in 1 2 3 4 5; do
            if git push; then exit 0; fi
            echo "push rejected on attempt $attempt, rebasing onto remote"
            git pull --rebase origin main
            sleep 2
          done
          echo "Failed to push after 5 attempts" >&2
          exit 1
      - name: Summary
        if: always()
        run: echo "## Scrape complete" >> "$GITHUB_STEP_SUMMARY"

  # ─────────────────────────────────────────────────────────────────────────
  # Stage 2: curate (dedupe + discovery + summarize)
  # ─────────────────────────────────────────────────────────────────────────
  curate:
    needs: [plan, scrape]
    if: |
      always() && needs.plan.outputs.run_curate == 'true' &&
      (needs.scrape.result == 'success' || needs.scrape.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - name: Cache sentence-transformers model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-minilm-l6-v2-v1
      - run: pip install -r scripts/requirements.txt
      - name: Curate (resumable)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LLM_DELAY_SECONDS: "3"
        run: python scripts/curate.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/raw/ content/latest.json
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "chore(pipeline): curate $(date -u +'%Y-%m-%d')"
          for attempt in 1 2 3 4 5; do
            if git push; then exit 0; fi
            echo "push rejected on attempt $attempt, rebasing onto remote"
            git pull --rebase origin main
            sleep 2
          done
          echo "Failed to push after 5 attempts" >&2
          exit 1
      - name: Deadline check
        if: needs.plan.outputs.is_deadline == 'true'
        run: |
          cd scripts
          python -c "
          from state import load_state, get_stage_status
          from edition import get_edition
          _, edition = get_edition()
          state = load_state(edition)
          status = get_stage_status(state, 'curate')
          if status != 'complete':
              print(f'DEADLINE MISS: curate stage is \"{status}\" at final sweeper')
              exit(1)
          print(f'Curate stage is complete — deadline met')
          "
      - name: Summary
        if: always()
        run: echo "## Curate complete" >> "$GITHUB_STEP_SUMMARY"

  # ─────────────────────────────────────────────────────────────────────────
  # Stage 3: finalize (per-cluster synthesis + assembly)
  # ─────────────────────────────────────────────────────────────────────────
  finalize:
    needs: [plan, curate]
    if: |
      always() && needs.plan.outputs.run_finalize == 'true' &&
      (needs.curate.result == 'success' || needs.curate.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - name: Cache sentence-transformers model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-minilm-l6-v2-v1
      - run: pip install -r scripts/requirements.txt
      - name: Finalize (resumable)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LLM_DELAY_SECONDS: "10"
          SITE_URL: ${{ vars.SITE_URL }}
          UNSUBSCRIBE_URL: ${{ vars.UNSUBSCRIBE_URL }}
        run: python scripts/finalize.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "chore(pipeline): finalize $(date -u +'%Y-%m-%d')"
          for attempt in 1 2 3 4 5; do
            if git push; then exit 0; fi
            echo "push rejected on attempt $attempt, rebasing onto remote"
            git pull --rebase origin main
            sleep 2
          done
          echo "Failed to push after 5 attempts" >&2
          exit 1
      - name: Deadline check
        if: needs.plan.outputs.is_deadline == 'true'
        run: |
          cd scripts
          python -c "
          from state import load_state, get_stage_status
          from edition import get_edition
          _, edition = get_edition()
          state = load_state(edition)
          status = get_stage_status(state, 'finalize')
          if status != 'complete':
              print(f'DEADLINE MISS: finalize stage is \"{status}\" at final sweeper')
              exit(1)
          print(f'Finalize stage is complete — deadline met')
          "
      - name: Summary
        if: always()
        run: echo "## Finalize complete" >> "$GITHUB_STEP_SUMMARY"

  # ─────────────────────────────────────────────────────────────────────────
  # Stage 4a: emergency check (runs before send + deploy)
  # ─────────────────────────────────────────────────────────────────────────
  emergency_check:
    needs: [plan, finalize]
    if: |
      always() && needs.plan.outputs.run_send == 'true' &&
      (needs.finalize.result == 'success' || needs.finalize.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      head_sha: ${{ steps.head.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: scripts/requirements-light.txt
      - run: pip install -r scripts/requirements-light.txt
      - name: Monday emergency check
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LLM_DELAY_SECONDS: "10"
          SITE_URL: ${{ vars.SITE_URL }}
          UNSUBSCRIBE_URL: ${{ vars.UNSUBSCRIBE_URL }}
        run: python scripts/monday_check.py
      - name: Commit any emergency updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "chore(pipeline): emergency update $(date -u +'%Y-%m-%d')"
          for attempt in 1 2 3 4 5; do
            if git push; then exit 0; fi
            echo "push rejected on attempt $attempt, rebasing onto remote"
            git pull --rebase origin main
            sleep 2
          done
          echo "Failed to push after 5 attempts" >&2
          exit 1
      - id: head
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # ─────────────────────────────────────────────────────────────────────────
  # Stage 4b: send newsletter via Brevo
  # ─────────────────────────────────────────────────────────────────────────
  send_newsletter:
    needs: emergency_check
    if: always() && needs.emergency_check.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.emergency_check.outputs.head_sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: scripts/requirements-light.txt
      - run: pip install -r scripts/requirements-light.txt
      - name: Send via Brevo
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_LIST_ID: ${{ secrets.BREVO_LIST_ID }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          UNSUBSCRIBE_URL: ${{ vars.UNSUBSCRIBE_URL }}
        run: python scripts/send_newsletter.py

  # ─────────────────────────────────────────────────────────────────────────
  # Stage 4c: deploy Astro site to GitHub Pages
  # ─────────────────────────────────────────────────────────────────────────
  deploy_site:
    needs: emergency_check
    if: always() && needs.emergency_check.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.emergency_check.outputs.head_sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install Node deps (fresh, cross-platform safe)
        run: |
          rm -rf node_modules package-lock.json
          npm install --no-audit --no-fund
      - name: Build Astro site
        env:
          ASTRO_TELEMETRY_DISABLED: 1
          PUBLIC_BREVO_FORM_URL: ${{ vars.PUBLIC_BREVO_FORM_URL }}
          PUBLIC_BREVO_UNSUBSCRIBE_URL: ${{ vars.PUBLIC_BREVO_UNSUBSCRIBE_URL }}
        run: npx astro build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/
      - id: deployment
        uses: actions/deploy-pages@v4

  # ─────────────────────────────────────────────────────────────────────────
  # Failure notifier — opens one GitHub issue per failed scheduled run.
  # Only fires on non-zero exit or deadline miss, not on partial exits.
  # ─────────────────────────────────────────────────────────────────────────
  notify_failure:
    needs: [plan, scrape, curate, finalize, emergency_check, send_newsletter, deploy_site]
    if: always() && failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const stage = `${{ needs.plan.outputs.stage }}`;
            const run = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const results = [
              `scrape: ${{ needs.scrape.result }}`,
              `curate: ${{ needs.curate.result }}`,
              `finalize: ${{ needs.finalize.result }}`,
              `emergency_check: ${{ needs.emergency_check.result }}`,
              `send_newsletter: ${{ needs.send_newsletter.result }}`,
              `deploy_site: ${{ needs.deploy_site.result }}`,
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[pipeline] ${stage} failed (${new Date().toISOString().slice(0,10)})`,
              labels: ['pipeline-failure', 'urgent'],
              body: [
                `**Weekly pipeline failed at stage: \`${stage}\`.**`,
                '',
                `Run: ${run}`,
                '',
                '```',
                results,
                '```',
              ].join('\n'),
            });
